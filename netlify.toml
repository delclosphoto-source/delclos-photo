# Netlify — delclos.photo
# No hi ha build: el lloc ja són fitxers estàtics.
# Si connectes el repositori sencer, posa "web" com a base directory a Netlify.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Els fitxers de treball no s'han de poder llegir des d'internet, encara
# que per error acabin pujats: són els textos i els scripts que generen
# la web, no formen part del lloc.
[[redirects]]
  from = "/contingut/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/actualitza.command"
  to = "/index.html"
  status = 404

# El ZIP viu dins d'aquesta mateixa carpeta per comoditat. Si algun dia
# s'hi cola en pujar-la, que no es pugui descarregar des d'internet:
# són 58 MB de la web sencera servits a qualsevol.
[[redirects]]
  from = "/delclos-photo-netlify.zip"
  to = "/index.html"
  status = 404
